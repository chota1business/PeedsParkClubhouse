name: Rollback Production
on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Previously deployed production-NNN tag (frontend only)'
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag and database compatibility
        id: target
        env:
          TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          [[ "$TARGET_TAG" =~ ^production-[0-9]+$ ]] || exit 1
          SHA=$(git rev-parse "refs/tags/$TARGET_TAG^{commit}")
          git merge-base --is-ancestor "$SHA" origin/main
          git diff --exit-code origin/main "$SHA" -- supabase
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
  publish:
    needs: select
    uses: ./.github/workflows/inject-secrets.yml
    with:
      sha: ${{ needs.select.outputs.sha }}
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
