name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g., v1.2.3 or auto-generated)'
        required: false

jobs:
  promote:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Configure git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
      
      # Generate version tag if not provided
      - name: Generate version tag
        if: github.event.inputs.version_tag == ''
        id: tag
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          TAG="v$(date +%Y.%m.%d)-${TIMESTAMP}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
      
      # Merge staging → main
      - name: Merge staging to main
        run: |
          git fetch origin
          git checkout main
          git merge --no-ff origin/staging -m "Promote staging to production ($(date))"
          git tag ${{ steps.tag.outputs.tag || github.event.inputs.version_tag }}
          git push origin main
          git push origin --tags
      
      # Deploy to production (GitHub Pages)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.PROD_SUPABASE_URL }}
          VITE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
      
      - name: Deploy to GitHub Pages (production)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: peedspark.com
      
      - name: Verify production deployment
        run: |
          echo "✓ Production deployed"
          echo "  URL: https://peedspark.com"
          echo "  Tag: ${{ steps.tag.outputs.tag || github.event.inputs.version_tag }}"
          echo "  Time: $(date)"
          echo ""
          echo "MANUAL VERIFICATION REQUIRED:"
          echo "1. Visit https://peedspark.com"
          echo "2. Test home page loads"
          echo "3. Try a booking flow"
          echo "4. Check admin login"
          echo ""
          echo "If broken, run ROLLBACK workflow immediately."
