name: Promote to Production
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select verified staging revision
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_SITE_URL: ${{ vars.STAGING_SITE_URL || 'https://chota1business.github.io/PeedsParkClubhouse-Staging' }}
        run: |
          SHA=$(python scripts/release.py candidate --site "$STAGING_SITE_URL")
          git fetch origin staging main
          git cat-file -e "$SHA^{commit}"
          git merge-base --is-ancestor "$SHA" origin/staging
          git merge-base --is-ancestor origin/main "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Promoting tested staging revision: $SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Require reviewed database compatibility
        env:
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          if ! git diff --quiet origin/main "$RELEASE_SHA" -- supabase; then
            echo '::error::Database/Edge Function changes need a reviewed database release first. See docs/releases.md.'
            exit 1
          fi
  publish:
    needs: select
    uses: ./.github/workflows/inject-secrets.yml
    with:
      sha: ${{ needs.select.outputs.sha }}
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  record:
    needs: [select, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record release without rewriting history
        env:
          RELEASE_SHA: ${{ needs.select.outputs.sha }}
        run: |
          git tag "production-$GITHUB_RUN_ID" "$RELEASE_SHA"
          git push origin "refs/tags/production-$GITHUB_RUN_ID"
          echo "Production release: production-$GITHUB_RUN_ID ($RELEASE_SHA)" >> "$GITHUB_STEP_SUMMARY"
