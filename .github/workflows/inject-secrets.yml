name: Deploy site with injected config

# Generates config.js from repository secrets and deploys the static site to
# GitHub Pages. config.js itself is gitignored and never committed — see
# config.js and js/supabase-client.js for how the pieces fit together.
#
# One-time setup required in this repo's GitHub settings:
#   1. Settings → Secrets and variables → Actions → New repository secret:
#        SUPABASE_URL
#        SUPABASE_ANON_KEY
#   2. Settings → Pages → Build and deployment → Source: "GitHub Actions"
#      (instead of "Deploy from a branch").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate config.js from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY repository secrets are not set."
            exit 1
          fi
          cat > config.js <<EOF
          // Generated by .github/workflows/inject-secrets.yml — do not edit.
          window.CONFIG = {
            SUPABASE_URL: "${SUPABASE_URL}",
            SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY}",
          };
          EOF

      - name: Stage site (exclude repo/CI internals)
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
