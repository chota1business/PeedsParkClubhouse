name: Publish verified production release
on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
    secrets:
      SUPABASE_URL:
        required: true
      SUPABASE_ANON_KEY:
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: tooling
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build production artifact using approved release tooling
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: python tooling/scripts/release.py build --root candidate --environment production --sha "$RELEASE_SHA"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify production deployment
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: python tooling/scripts/release.py verify --site https://peedspark.com --environment production --sha "$RELEASE_SHA"
