<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login — PeedsPark Club House</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<div class="login-wrap">
  <div class="login-card">
    <a class="brand" href="../index.html" style="margin:0 auto 4px; justify-content:center;">
      <img src="../images/peedspark-logo.jpg" alt="PeedsPark Club House logo">
      <div><strong>Peeds Park</strong><span>Club House</span></div>
    </a>
    <p class="muted center" style="margin-top:-8px;">Admin &amp; Manager Login</p>

    <form id="loginForm" class="panel-form" style="box-shadow:none; padding:0; margin-top:20px;">
      <label>Email
        <input type="email" name="email" id="loginEmail" required autocomplete="username">
      </label>
      <label>Password
        <input type="password" name="password" id="loginPassword" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Log In</button>
      <p id="loginError" class="login-error" hidden></p>
    </form>

    <p class="center small" style="margin-top:12px;"><a href="#" id="forgotPasswordLink">Forgot password?</a></p>

    <form id="forgotForm" class="panel-form" style="box-shadow:none; padding:0; margin-top:4px;" hidden>
      <label>Email
        <input type="email" name="email" id="forgotEmail" required autocomplete="username">
      </label>
      <button type="submit" class="btn btn-outline-dark" style="width:100%;">Send Reset Link</button>
      <p id="forgotMessage" class="small muted" hidden></p>
    </form>

    <p class="center small muted" style="margin-top:20px;">
      Staff accounts only — invited by an Admin. Not staff? <a href="../index.html">Back to the main site</a>.
    </p>
  </div>
</div>

<footer class="site-footer" id="contact">
  <div class="container footer-inner">
    <div><strong>PeedsPark Club House</strong><br><span>Ammancherry &bull; Kerala 686561</span></div>
    <div>Sports &bull; Celebrations &bull; Memories</div>
    <div><a href="../privacy-policy.html" class="footer-link">Privacy &amp; Booking Policy</a></div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="js/admin-auth.js"></script>
</body>
</html>
