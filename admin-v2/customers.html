<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers — PeedsPark Admin</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<header class="admin-header">
  <div class="container admin-header-inner">
    <a href="dashboard.html" class="logo">Peeds<span>Park</span> <span class="admin-tag">Admin</span></a>
    <div class="admin-user">
      <span id="staffName">Loading…</span>
      <span id="staffRole" class="role-badge"></span>
      <button id="changePasswordBtn" class="btn btn-outline-dark">Change Password</button>
      <button id="logoutBtn" class="btn btn-outline-dark">Log Out</button>
    </div>
  </div>
</header>

<main class="container admin-main">
  <div id="notAuthorised" hidden class="policy-card" style="border-left:6px solid var(--coral); max-width:520px; margin:60px auto;">
    <h3>Not authorised</h3>
    <p>This account isn't set up as PeedsPark staff.</p>
    <a class="btn btn-primary" href="index.html">Back to login</a>
  </div>

  <div id="pageContent" hidden>
    <div class="page-head">
      <a href="dashboard.html" class="back-link">&larr; Dashboard</a>
      <h2>🧑‍🤝‍🧑 Customers</h2>
    </div>
    <p class="muted" style="margin:-8px 0 20px;">Auto-built from every enquiry and booking — one row per phone number. Sort/filter below to spot your regulars.</p>

    <div class="filter-row" style="align-items:center;">
      <input type="search" id="customerSearch" placeholder="Search name or phone…" style="flex:1;min-width:200px;padding:10px 14px;border-radius:999px;border:2px solid var(--line, #e5e5e5);font-size:0.95rem;">
      <button class="filter-chip active" data-sort="recent">Most recent</button>
      <button class="filter-chip" data-sort="frequent">Most bookings</button>
    </div>

    <div id="customerList" class="enquiry-list">
      <p class="muted center" style="padding:40px;">Loading customers…</p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/customers.js"></script>
</body>
</html>
