<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enquiries — PeedsPark Admin</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<header class="admin-header">
  <div class="container admin-header-inner">
    <a href="dashboard.html" class="logo">Peeds<span>Park</span> <span class="admin-tag">Admin</span></a>
    <div class="admin-user">
      <span id="staffName">Loading…</span>
      <span id="staffRole" class="role-badge"></span>
      <button id="changePasswordBtn" class="btn btn-outline-dark">Change Password</button>
      <button id="logoutBtn" class="btn btn-outline-dark">Log Out</button>
    </div>
  </div>
</header>

<main class="container admin-main">
  <div id="notAuthorised" hidden class="policy-card" style="border-left:6px solid var(--coral); max-width:520px; margin:60px auto;">
    <h3>Not authorised</h3>
    <p>This account isn't set up as PeedsPark staff.</p>
    <a class="btn btn-primary" href="index.html">Back to login</a>
  </div>

  <div id="pageContent" hidden>
    <div class="page-head">
      <a href="dashboard.html" class="back-link">&larr; Dashboard</a>
      <h2>📋 Enquiries</h2>
    </div>

    <div class="filter-row">
      <button class="filter-chip active" data-status="all">All</button>
      <button class="filter-chip" data-status="new">New</button>
      <button class="filter-chip" data-status="contacted">Contacted</button>
      <button class="filter-chip" data-status="follow_up">Follow-up</button>
      <button class="filter-chip" data-status="converted">Converted</button>
      <button class="filter-chip" data-status="lost">Lost</button>
    </div>

    <div id="enquiryList" class="enquiry-list">
      <p class="muted center" style="padding:40px;">Loading enquiries…</p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/enquiries.js"></script>
</body>
</html>
