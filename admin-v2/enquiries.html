<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enquiries — PeedsPark Admin</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/manager-feed.css">
</head>
<body class="admin-body">

<header class="admin-header">
  <div class="container admin-header-inner">
    <a href="dashboard.html" class="brand">
      <img src="../images/peedspark-logo.jpg" alt="PeedsPark Club House logo">
      <div><strong>Peeds Park</strong><span>Admin</span></div>
    </a>
    <div class="admin-user">
      <span id="staffName">Loading…</span>
      <span id="staffRole" class="role-badge"></span>
      <button id="logoutBtn" class="btn btn-outline-dark">Log Out</button>
    </div>
  </div>
</header>

<main class="container admin-main">
  <div id="notAuthorised" hidden class="policy-card" style="border-left:6px solid var(--coral); max-width:520px; margin:60px auto;">
    <h3>Not authorised</h3>
    <p>This account isn't set up as PeedsPark staff.</p>
    <a class="btn btn-primary" href="index.html">Back to login</a>
  </div>

  <div id="pageContent" hidden>
    <div class="page-head">
      <a href="dashboard.html" class="back-link">&larr; Dashboard</a>
      <h2>📋 Enquiries</h2>
    </div>

    <div class="filter-row" style="justify-content:space-between;">
      <div class="filter-row" style="margin:0;">
        <button class="filter-chip active" data-status="all">All</button>
        <button class="filter-chip" data-status="new">New</button>
        <button class="filter-chip" data-status="contacted">Contacted</button>
        <button class="filter-chip" data-status="follow_up">Follow-up</button>
        <button class="filter-chip" data-status="converted">Converted</button>
        <button class="filter-chip" data-status="lost">Lost</button>
      </div>
      <button id="openAddEnquiryBtn" class="btn btn-primary btn-sm">+ Add Enquiry</button>
    </div>

    <div class="form-row" style="margin:12px 0;">
      <label>Search
        <input type="search" id="enquirySearch" placeholder="Name or phone…">
      </label>
      <label>From
        <input type="date" id="enquiryDateFrom">
      </label>
      <label>To
        <input type="date" id="enquiryDateTo">
      </label>
    </div>

    <div id="enquiryList" class="enquiry-list">
      <p class="muted center" style="padding:40px;">Loading enquiries…</p>
    </div>
    <div id="enquiryPager" class="pager-row" style="margin-top:12px; text-align:center;"></div>
  </div>

  <!-- Add / Edit Enquiry modal -->
  <div id="enquiryModal" class="modal-backdrop" hidden>
    <div class="modal-card">
      <button class="modal-close" id="closeEnquiryModalBtn" aria-label="Close">&times;</button>
      <h3 id="enquiryModalTitle">Add Enquiry</h3>
      <form id="enquiryForm2">
        <input type="hidden" name="id">
        <div class="modal-row">
          <label>Name*
            <input type="text" name="customer_name" required minlength="2">
          </label>
          <label>Phone*
            <input type="tel" name="phone" id="enquiryPhoneInput2" required inputmode="numeric" placeholder="10-digit mobile number">
          </label>
        </div>
        <div class="modal-row">
          <label>Email
            <input type="email" name="email">
          </label>
          <label>Facility
            <select name="facility_id">
              <option value="">Not sure / multiple</option>
              <option value="ac_hall">AC Hall</option>
              <option value="non_ac_hall">Non-AC Hall</option>
              <option value="lawn">Lawn</option>
              <option value="pool">Swimming Pool</option>
              <option value="badminton_1">Badminton Court 1</option>
              <option value="badminton_2">Badminton Court 2</option>
            </select>
          </label>
        </div>
        <div class="modal-row">
          <label>Preferred date
            <input type="date" name="preferred_date">
          </label>
          <label>Guests
            <input type="number" name="guests" min="1">
          </label>
        </div>
        <label id="enquiryStatusFieldWrap" hidden>Status
          <select name="status">
            <option value="new">New</option>
            <option value="contacted">Contacted</option>
            <option value="follow_up">Follow-up</option>
            <option value="converted">Converted</option>
            <option value="lost">Lost</option>
          </select>
        </label>
        <label>Message
          <textarea name="message" rows="2"></textarea>
        </label>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Save Enquiry</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Convert to Booking modal -->
  <div id="convertModal" class="modal-backdrop" hidden>
    <div class="modal-card">
      <button class="modal-close" id="closeConvertModalBtn" aria-label="Close">&times;</button>
      <h3>Convert to Booking</h3>
      <form id="convertForm">
        <input type="hidden" name="enquiry_id">
        <p id="convertCustomerLine" class="muted small"></p>
        <label>Facility*
          <select name="facility_id" id="convertFacilitySelect" required>
            <option value="ac_hall">AC Hall</option>
            <option value="non_ac_hall">Non-AC Hall</option>
            <option value="lawn">Lawn</option>
            <option value="pool">Swimming Pool</option>
            <option value="badminton_1">Badminton Court 1</option>
            <option value="badminton_2">Badminton Court 2</option>
          </select>
        </label>
        <label>Date*
          <input type="date" name="booking_date" id="convertDateInput" required>
        </label>
        <div id="convertFixedSlotFields" class="modal-row" hidden>
          <label>Slot*
            <select name="slot">
              <option value="morning">Morning (8am–2pm)</option>
              <option value="evening">Evening (4pm–10pm)</option>
              <option value="full_day">Full Day</option>
            </select>
          </label>
        </div>
        <div id="convertHourlyFields" class="modal-row" hidden>
          <label>Start time*
            <input type="time" name="start_time" value="10:00">
          </label>
          <label>Duration (hours)*
            <select name="duration">
              <option value="1">1 hour</option>
              <option value="2">2 hours</option>
              <option value="3">3 hours</option>
              <option value="4">4 hours</option>
            </select>
          </label>
        </div>
        <label id="convertModeFieldWrap" hidden>Booking mode
          <select name="mode">
            <option value="shared">Shared</option>
            <option value="exclusive">Exclusive</option>
          </select>
        </label>
        <label>Guests
          <input type="number" name="guests" min="1">
        </label>
        <label style="display:flex; align-items:center; gap:8px;">
          <input type="checkbox" name="mark_approved" style="width:auto;">
          Approve immediately (asks for payment next)
        </label>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Create Booking</button>
        </div>
      </form>
    </div>
  </div>
</main>

<footer class="site-footer" id="contact">
  <div class="container footer-inner">
    <div><strong>PeedsPark Club House</strong><br><span>Ammancherry &bull; Kerala 686561</span></div>
    <div>Sports &bull; Celebrations &bull; Memories</div>
    <div><a href="../privacy-policy.html" class="footer-link">Privacy &amp; Booking Policy</a></div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase-client.js?v=20260903"></script>
<script src="js/admin-auth.js?v=20260903"></script>
<script src="js/list-controls.js?v=20260903"></script>
<script src="js/enquiries.js?v=20260903"></script>
</body>
</html>
