<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — PeedsPark Admin</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<div class="login-wrap">
  <div class="login-card">
    <p class="logo login-logo">Peeds<span>Park</span></p>
    <p class="muted center" style="margin-top:-8px;">Set a new password</p>

    <div id="resetPending" class="center" style="margin-top:20px;">
      <p class="muted">Checking your reset link…</p>
    </div>

    <form id="resetForm" class="panel-form" style="box-shadow:none; padding:0; margin-top:20px;" hidden>
      <label>New password
        <input type="password" name="password" id="newPassword" required minlength="8" autocomplete="new-password">
      </label>
      <label>Confirm new password
        <input type="password" name="confirmPassword" id="confirmPassword" required minlength="8" autocomplete="new-password">
      </label>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Set Password</button>
      <p id="resetError" class="login-error" hidden></p>
    </form>

    <div id="resetInvalid" class="center" hidden style="margin-top:20px;">
      <p>This reset link is invalid or has expired. Request a new one from the login page.</p>
      <a class="btn btn-primary" href="index.html">Back to login</a>
    </div>

    <div id="resetSuccess" class="center" hidden style="margin-top:20px;">
      <p>Password updated — you can log in now.</p>
      <a class="btn btn-primary" href="index.html">Go to login</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
