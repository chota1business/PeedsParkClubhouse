<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hall &amp; Lawn Bookings — PeedsPark Admin</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/manager-feed.css">
</head>
<body class="admin-body">

<header class="admin-header">
  <div class="container admin-header-inner">
    <a href="dashboard.html" class="logo">Peeds<span>Park</span> <span class="admin-tag">Admin</span></a>
    <div class="admin-user">
      <span id="staffName">Loading…</span>
      <span id="staffRole" class="role-badge"></span>
      <button id="logoutBtn" class="btn btn-outline-dark">Log Out</button>
    </div>
  </div>
</header>

<main class="container admin-main">
  <div id="notAuthorised" hidden class="policy-card" style="border-left:6px solid var(--coral); max-width:520px; margin:60px auto;">
    <h3>Not authorised</h3>
    <p>This account isn't set up as PeedsPark staff.</p>
    <a class="btn btn-primary" href="index.html">Back to login</a>
  </div>

  <div id="pageContent" hidden>
    <div class="page-head">
      <a href="dashboard.html" class="back-link">&larr; Dashboard</a>
      <h2>🏛️ Hall &amp; Lawn Bookings</h2>
    </div>

    <div class="filter-row">
      <button class="filter-chip active" data-status="all">All</button>
      <button class="filter-chip" data-status="pending">Pending</button>
      <button class="filter-chip" data-status="approved">Approved</button>
      <button class="filter-chip" data-status="rejected">Rejected</button>
      <button class="filter-chip" data-status="cancelled">Cancelled</button>
    </div>

    <div id="bookingList" class="enquiry-list">
      <p class="muted center" style="padding:40px;">Loading bookings…</p>
    </div>

    <div class="page-head" style="margin-top:44px;">
      <h2>🚫 Block / Unblock Slots</h2>
    </div>
    <form id="blockForm" class="panel-form">
      <div class="form-row">
        <label>Facility*
          <select name="facility_id" required>
            <option value="ac_hall">AC Hall</option>
            <option value="non_ac_hall">Non-AC Hall</option>
            <option value="lawn">Lawn</option>
          </select>
        </label>
        <label>Reason
          <input type="text" name="reason" placeholder="Maintenance, private event...">
        </label>
      </div>
      <div class="form-row">
        <label>From*
          <input type="datetime-local" name="start_at" required>
        </label>
        <label>To*
          <input type="datetime-local" name="end_at" required>
        </label>
      </div>
      <button type="submit" class="btn btn-primary">Add Block</button>
    </form>
    <p id="blockAdminNote" class="muted small" hidden>Blocking a facility for maintenance is an Admin-only action — ask an Admin to add or remove one.</p>

    <div id="blockList" class="enquiry-list" style="margin-top:16px;"></div>
  </div>

  <!-- Edit Booking modal (date/slot/guests/notes — not payment or status) -->
  <div id="editBookingModal" class="modal-backdrop" hidden>
    <div class="modal-card">
      <button class="modal-close" id="closeEditBookingBtn" aria-label="Close">&times;</button>
      <h3>Edit Booking</h3>
      <form id="editBookingForm">
        <input type="hidden" name="id">
        <div class="modal-row">
          <label>Name*
            <input type="text" name="customer_name" required minlength="2">
          </label>
          <label>Phone*
            <input type="tel" name="phone" required inputmode="numeric">
          </label>
        </div>
        <div class="modal-row">
          <label>Date*
            <input type="date" name="booking_date" required>
          </label>
          <label>Slot*
            <select name="slot" required>
              <option value="morning">Morning (8am–2pm)</option>
              <option value="evening">Evening (4pm–10pm)</option>
              <option value="full_day">Full Day</option>
            </select>
          </label>
        </div>
        <label>Guests
          <input type="number" name="guests" min="1">
        </label>
        <label>Notes
          <textarea name="notes" rows="2"></textarea>
        </label>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/bookings.js"></script>
</body>
</html>
