name: Deploy to Staging

on:
  # Runs every day at 9 PM IST (3:30 PM UTC)
  schedule:
    - cron: '30 15 * * *'

  # Also allows manual trigger
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      # Deploy static files directly to GitHub Pages (staging domain)
      - name: Deploy to GitHub Pages (staging)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          cname: staging.peedspark.com

      - name: Notify deployment
        run: |
          echo "✅ Deployment to staging.peedspark.com completed successfully"
          echo "Visit: https://staging.peedspark.com"
